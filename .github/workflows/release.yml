name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build universal binary
        run: ./scripts/build-universal.sh dist
      - name: Verify builds and tests
        run: |
          swift build
          swift test
          swift build -c release
          git diff --check

      - name: Verify release executable
        run: |
          dist/alien-findphone/findphone --help
          test -x dist/alien-findphone/findphone
          test -d dist/alien-findphone/findphone_findphone.bundle

      - name: Smoke test
        run: |
          ./dist/alien-findphone/findphone --help
          ./dist/alien-findphone/findphone --list

      - name: Package
        run: |
          cp README.md dist/alien-findphone/
          tar -C dist -czf findphone-macos-universal.tar.gz alien-findphone
          shasum -a 256 findphone-macos-universal.tar.gz | tee checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            Universal macOS binary (arm64 + x86_64). Requires macOS 13 or later.

            The binary is unsigned, so macOS quarantines it after download.
            Clearing that is the third line:

                tar -xzf findphone-macos-universal.tar.gz
                xattr -dr com.apple.quarantine alien-findphone
                ./alien-findphone/findphone --help

            Needs Bluetooth permission for whichever terminal runs it, under
            System Settings > Privacy & Security > Bluetooth.
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$NOTES" \
            findphone-macos-universal.tar.gz \
            checksums.txt
